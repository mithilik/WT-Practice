<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MySQL & PHP Quiz</title>
<style>
  :root{
    --ink:#1b2430;
    --paper:#eef1f0;
    --panel:#ffffff;
    --rule:#c7d0cd;
    --accent:#1f6f5c;
    --accent-dim:#a9c9c0;
    --right:#1e7a3d;
    --right-bg:#e3f5e6;
    --wrong:#b3261e;
    --wrong-bg:#fbe6e4;
    --mono:'Courier New', ui-monospace, monospace;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }

  .wrap{
    width:100%;
    max-width:640px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:6px;
  }

  h1{
    font-size:1.35rem;
    margin:0;
    letter-spacing:0.2px;
    font-weight:600;
  }

  #counter{
    font-family:var(--mono);
    font-size:0.85rem;
    color:var(--accent);
    white-space:nowrap;
    padding-left:12px;
  }

  .progress-track{
    height:4px;
    background:var(--rule);
    margin-bottom:28px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--rule);
    padding:28px 26px 24px;
  }

  .qtext{
    font-size:1.12rem;
    line-height:1.5;
    margin:0 0 18px;
  }

  pre.code{
    font-family:var(--mono);
    font-size:0.86rem;
    background:#f4f6f5;
    border-left:3px solid var(--accent-dim);
    padding:12px 14px;
    margin:0 0 18px;
    overflow-x:auto;
    line-height:1.45;
    white-space:pre;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    background:var(--paper);
    border:1px solid var(--rule);
    font-family:inherit;
    font-size:0.98rem;
    color:var(--ink);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease, transform .05s ease;
  }
  .option:hover:not(:disabled){
    border-color:var(--accent);
  }
  .option:active:not(:disabled){
    transform:translateY(1px);
  }
  .option .lab{
    font-family:var(--mono);
    font-weight:700;
    color:var(--accent);
    flex-shrink:0;
  }

  .option.correct{
    background:var(--right-bg);
    border-color:var(--right);
    color:var(--right);
  }
  .option.correct .lab{color:var(--right);}

  .option.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .option.wrong .lab{color:var(--wrong);}

  .option:disabled{
    cursor:default;
  }

  .feedback{
    min-height:1.4em;
    margin-top:16px;
    font-family:var(--mono);
    font-size:0.88rem;
    font-weight:600;
  }
  .feedback.right{color:var(--right);}
  .feedback.wrong{color:var(--wrong);}

  footer{
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
  }

  #next-btn{
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 22px;
    background:var(--ink);
    color:#fff;
    border:none;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  #next-btn.show{
    opacity:1;
    pointer-events:auto;
  }
  #next-btn:hover{background:var(--accent);}

  .done{
    text-align:center;
    padding:60px 20px;
  }
  .done h2{margin-bottom:8px;}
  .done p{color:#555;}
  #restart-btn{
    margin-top:22px;
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 24px;
    background:var(--accent);
    color:#fff;
    border:none;
    cursor:pointer;
  }

  /* NEW: start screen styles */
  .start-field{margin-bottom:16px;}
  .start-field label{
    display:block;
    font-family:var(--mono);
    font-size:0.85rem;
    margin-bottom:6px;
    color:var(--accent);
    font-weight:700;
  }
  .start-field input{
    width:100%;
    padding:10px 12px;
    font-family:inherit;
    font-size:1rem;
    border:1px solid var(--rule);
    background:var(--paper);
  }
  #start-error{
    min-height:1.4em;
    margin-bottom:12px;
    color:var(--wrong);
    font-family:var(--mono);
    font-size:0.88rem;
    font-weight:600;
  }
  #start-btn{
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 24px;
    background:var(--accent);
    color:#fff;
    border:none;
    cursor:pointer;
  }

  /* NEW: page footer */
  .credit{
    margin-top:36px;
    padding-top:12px;
    border-top:1px solid var(--rule);
    text-align:center;
    font-family:var(--mono);
    font-size:0.82rem;
    color:#555;
  }

  @media (max-width:480px){
    .card{padding:20px 16px;}
    h1{font-size:1.1rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Unit 1 to Unit 4 — Practice/Self Assessment</h1>
    <div id="counter"></div>
  </header>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <!-- NEW: start screen (name + roll no compulsory) -->
  <div class="card" id="start-area">
    <h2 style="margin-top:0">Enter your details to begin</h2>
    <div class="start-field">
      <label for="student-name">NAME</label>
      <input type="text" id="student-name" autocomplete="off">
    </div>
    <div class="start-field">
      <label for="roll-no">ROLL NO</label>
      <input type="text" id="roll-no" autocomplete="off">
    </div>
    <div id="start-error"></div>
    <button id="start-btn">Start Test</button>
  </div>

  <div class="card" id="quiz-area" style="display:none;"></div>

  <footer>
    <button id="next-btn">Next question →</button>
  </footer>

  <div class="credit">Powered by Mithili Kakodkar</div>
</div>

const quizArea = document.getElementById('quiz-area');
const nextBtn = document.getElementById('next-btn');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progress-fill');

function render(){
  answered = false;
  nextBtn.classList.remove('show');
  counter.textContent = `Question ${current + 1} / ${QUESTIONS.length}`;
  progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';

  const item = QUESTIONS[current];

  let html = `<p class="qtext">${escapeHtml(item.q)}</p>`;
  if(item.code){
    html += `<pre class="code">${escapeHtml(item.code)}</pre>`;
  }
  html += `<div class="options">`;
  item.o.forEach((opt, i) => {
    html += `<button class="option" data-i="${i}"><span class="lab">${LETTERS[i]}</span><span>${escapeHtml(opt)}</span></button>`;
  });
  html += `</div><div class="feedback" id="feedback"></div>`;

  quizArea.innerHTML = html;

  quizArea.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', onSelect);
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onSelect(e){
  if(answered) return;
  answered = true;

  const chosen = parseInt(e.currentTarget.dataset.i, 10);
  const item = QUESTIONS[current];
  const options = quizArea.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');

  options.forEach(btn => btn.disabled = true);

  if(chosen === item.a){
    score++; // NEW
    options[chosen].classList.add('correct');
    feedback.textContent = "Correct.";
    feedback.className = "feedback right";
  } else {
    options[chosen].classList.add('wrong');
    options[item.a].classList.add('correct');
    feedback.textContent = "Incorrect — correct answer highlighted.";
    feedback.className = "feedback wrong";
  }

  if(current < QUESTIONS.length - 1){
    nextBtn.classList.add('show');
    nextBtn.textContent = "Next question →";
  } else {
    nextBtn.classList.add('show');
    nextBtn.textContent = "Finish";
  }
}

nextBtn.addEventListener('click', () => {
  if(current < QUESTIONS.length - 1){
    current++;
    render();
  } else {
    showDone();
  }
});

function showDone(){
  progressFill.style.width = '100%';
  counter.textContent = `Question ${QUESTIONS.length} / ${QUESTIONS.length}`;
  quizArea.innerHTML = `
    <div class="done">
      <h2>All done.</h2>
      <p>You've gone through all ${QUESTIONS.length} questions.</p>
      <h2>Your Score: ${score} / ${QUESTIONS.length}</h2>
      <button id="restart-btn">Restart quiz</button>
    </div>`;
  nextBtn.classList.remove('show');
  document.getElementById('restart-btn').addEventListener('click', () => {
    current = 0;
    score = 0; // NEW
    render();
  });
}

// NEW: start button - name and roll no are compulsory (values are not used)
document.getElementById('start-btn').addEventListener('click', () => {
  const name = document.getElementById('student-name').value.trim();
  const roll = document.getElementById('roll-no').value.trim();
  const err = document.getElementById('start-error');
  if(!name || !roll){
    err.textContent = "Please enter both your Name and Roll No to start the test.";
    return;
  }
  // Valid roll no: 131 to 145, or V-131 to V-135
  const rollNum = /^(13[1-9]|14[0-5])$/;
  const rollV = /^V-(13[1-5])$/i;
  if(!(rollNum.test(roll) || rollV.test(roll))){
    err.textContent = "Invalid roll number";
    return;
  }
  err.textContent = "";
  document.getElementById('start-area').style.display = 'none';
  quizArea.style.display = 'block';
  render();
});
</script>
</body>
</html>
